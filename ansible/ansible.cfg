[defaults]
inventory = ./inventory.yml
roles_path = ./roles
host_key_checking = False
remote_user = ubuntu
timeout = 60
gather_timeout = 60

log_path = ./ansible.log
stdout_callback = default
callback_result_format = yaml
bin_ansible_callbacks = True
interpreter_python = auto
deprecation_warnings = False

[ssh_connection]
# SSH connection optimizations for EC2
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
timeout = 60
