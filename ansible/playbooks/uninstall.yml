---
# Playbook: uninstall.yml
# Purpose: Completely uninstall k3s from all nodes
# WARNING: This will destroy the entire cluster and all data

- name: Confirm uninstallation
  hosts: localhost
  gather_facts: false

  vars_prompt:
    - name: confirm_uninstall
      prompt: "Are you sure you want to uninstall the entire k3s cluster? (yes/no)"
      private: no

  tasks:
    - name: Abort if not confirmed
      ansible.builtin.fail:
        msg: "Uninstallation cancelled by user"
      when: confirm_uninstall != "yes"

- name: Uninstall k3s from worker nodes
  hosts: workers
  become: true
  gather_facts: false

  tasks:
    - name: Run k3s-agent-uninstall script
      ansible.builtin.shell: /usr/local/bin/k3s-agent-uninstall.sh
      ignore_errors: yes

    - name: Verify k3s agent is removed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-agent
      register: agent_binary

    - name: Display uninstall result
      ansible.builtin.debug:
        msg: "k3s-agent on {{ inventory_hostname }}: {{ 'removed' if not agent_binary.stat.exists else 'still present' }}"

- name: Uninstall k3s from master node
  hosts: master
  become: true
  gather_facts: false

  tasks:
    - name: Run k3s-uninstall script
      ansible.builtin.shell: /usr/local/bin/k3s-uninstall.sh
      ignore_errors: yes

    - name: Verify k3s is removed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Display uninstall result
      ansible.builtin.debug:
        msg: "k3s on {{ inventory_hostname }}: {{ 'removed' if not k3s_binary.stat.exists else 'still present' }}"

- name: Clean up all nodes
  hosts: k3s_cluster
  become: true
  gather_facts: false

  tasks:
    - name: Remove k3s directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
      ignore_errors: yes

    - name: Display cleanup complete
      ansible.builtin.debug:
        msg: "Cleanup completed on {{ inventory_hostname }}"
