---
# Playbook: install.yml
# Purpose: Complete installation of k3s cluster (master + workers)
# This is the main installation playbook that orchestrates the entire cluster setup

- name: Install and configure common dependencies on all nodes
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - common

- name: Install k3s control plane (master)
  hosts: master
  become: true
  gather_facts: true
  roles:
    - master

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - worker
