# Ansible Inventory for AWS K3s Cluster (Optional - for future Terraform integration)
# This inventory will be used when deploying to AWS EC2 instances

# Example configuration (update with actual IPs from Terraform output)

[master]
# k3s-master ansible_host=<terraform_output_master_ip> ansible_user=ubuntu

[workers]
# k3s-worker-1 ansible_host=<terraform_output_worker1_ip> ansible_user=ubuntu
# k3s-worker-2 ansible_host=<terraform_output_worker2_ip> ansible_user=ubuntu

[k3s_cluster:children]
master
workers

[k3s_cluster:vars]
ansible_python_interpreter=/usr/bin/python3
# Update this with your AWS SSH key
# ansible_ssh_private_key_file=~/.ssh/aws-key.pem

# AWS specific settings
# ansible_ssh_common_args='-o StrictHostKeyChecking=no'
