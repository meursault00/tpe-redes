# Ansible Inventory for Local K3s Cluster (Multipass VMs)
# Network: 192.168.64.0/24

[master]
k3s-master ansible_host=192.168.64.20 ansible_user=ubuntu

[workers]
k3s-worker-1 ansible_host=192.168.64.21 ansible_user=ubuntu
k3s-worker-2 ansible_host=192.168.64.22 ansible_user=ubuntu
# k3s-worker-3 ansible_host=192.168.64.13 ansible_user=ubuntu

[k3s_cluster:children]
master
workers

[k3s_cluster:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_rsa
