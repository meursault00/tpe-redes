all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/multipass_id_rsa

  children:
    master:
      hosts:
        k3s-master:
          ansible_host: 192.168.2.17
    workers:
      hosts:
        k3s-worker-1:
          ansible_host: 192.168.2.18
        k3s-worker-2:
          ansible_host: 192.168.2.19
