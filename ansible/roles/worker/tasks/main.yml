---
- name: Read join token
  slurp:
    src: "{{ playbook_dir }}/join-token.txt"
  delegate_to: localhost
  become: false
  register: tokenfile

- name: Get master IP from inventory
  set_fact:
    master_ip: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"

- name: Join worker to cluster
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL=https://{{ master_ip }}:6443 \
    K3S_TOKEN={{ tokenfile.content | b64decode | trim }} sh -
  args:
    creates: /usr/local/bin/k3s-agent
  timeout: 300
  retries: 2
  delay: 30