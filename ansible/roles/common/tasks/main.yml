---
# Role: common
# Purpose: Configure common dependencies and settings for all k3s nodes

- name: Wait for automatic system updates to complete
  ansible.builtin.shell: |
    while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null || pgrep -x unattended-upgrades > /dev/null; do
      echo "Waiting for automatic updates to complete..."
      sleep 10
    done
  timeout: 180
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  timeout: 120
  retries: 3
  delay: 10

- name: Install required packages (minimal set for faster installation)
  ansible.builtin.apt:
    name:
      - curl
      - wget
    state: present
  timeout: 120
  retries: 3
  delay: 10

- name: Install additional packages (nice-to-have)
  ansible.builtin.apt:
    name:
      - vim
      - git
      - htop
      - net-tools
      - apt-transport-https
      - ca-certificates
      - software-properties-common
    state: present
  timeout: 180
  retries: 2
  delay: 15
  ignore_errors: true  # Don't fail if these optional packages can't be installed

- name: Configure system timezone
  community.general.timezone:
    name: "{{ timezone | default('UTC') }}"
  when: timezone is defined

- name: Disable swap (required for Kubernetes)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes
  when: enable_ipv6 | default(false)

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Display common setup completion
  ansible.builtin.debug:
    msg: "Common dependencies configured on {{ inventory_hostname }}"
